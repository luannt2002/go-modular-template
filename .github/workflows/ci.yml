name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x" # bản còn nhận vá; go.mod chỉ là bản tối thiểu
      - run: make check
      - run: make build
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:ci .
